[package]
name = "rmd-cli"
version = "0.3.0"
edition = "2024"
description = "Linux reminder daemon and CLI: one-shot D-Bus notifications that survive reboot"
license = "MIT"
repository = "https://github.com/PaulBunch/rmd"
readme = "README.md"
keywords = ["reminder", "linux", "notifications", "daemon", "dbus"]
categories = ["command-line-utilities", "date-and-time"]

[[bin]]
name = "rmd"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1", default-features = false, features = ["rt", "net", "time", "macros", "io-util"] }
# Serialization (JSON state & IPC protocol)
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Command-line argument parsing
clap = { version = "4", features = ["derive"] }
# Date & time handling
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# Desktop notifications via D-Bus
zbus = "5"
# Application-level error handling
anyhow = "1.0"
# Standard system paths (XDG specifications)
dirs = "6"
terminal_size = "0.4"

[profile.release]
opt-level = "z"     # Optimize aggressively for binary size
lto = true          # Link-Time Optimization across all crates
codegen-units = 1   # Reduce parallel code generation units for maximum compression
panic = "abort"     # Disable stack unwinding tables on panic
strip = true        # Strip debug symbols automatically
